name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate; must match gleam.toml"
        required: true
        type: string
      create_github_release:
        description: "Create or update the GitHub release (tag refs only)"
        required: true
        default: false
        type: boolean
      publish_hex:
        description: "Publish the package to Hex (tag refs only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, attest, and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CREATE_GITHUB_RELEASE: ${{ github.event_name == 'push' || inputs.create_github_release }}
      PUBLISH_HEX: ${{ inputs.publish_hex }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: "27"
          gleam-version: "1.17.0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install differential-test oracle
        run: python -m pip install --disable-pip-version-check numpy==2.4.4

      - name: Verify release version and ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          package_version="$(awk -F '"' '/^version =/ { print $2; exit }' gleam.toml)"
          release_version="$INPUT_VERSION"
          if [ -z "$release_version" ]; then
            release_version="${GITHUB_REF_NAME#v}"
          fi
          if [ "$package_version" != "$release_version" ]; then
            echo "::error::gleam.toml version $package_version does not match $release_version"
            exit 1
          fi
          if [ "$CREATE_GITHUB_RELEASE" = "true" ] || [ "$PUBLISH_HEX" = "true" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
              echo "::error::releasing requires the exact tag v$package_version"
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          gleam format --check src test
          gleam format --check nla_weird_matrix_tests/src nla_weird_matrix_tests/test
          gleam format --check benchmarks/src

      - name: Verify NumPy/LAPACK fixtures
        working-directory: nla_weird_matrix_tests
        run: python tools/generate_weird_cases.py --check

      - name: Test root package on Erlang
        run: gleam test --target erlang

      - name: Test root package on JavaScript
        run: gleam test --target javascript

      - name: Test external package on Erlang
        working-directory: nla_weird_matrix_tests
        run: gleam test --target erlang

      - name: Test external package on JavaScript
        working-directory: nla_weird_matrix_tests
        run: gleam test --target javascript

      - name: Build documentation
        run: gleam docs build

      - name: Build release artifact
        run: |
          set -eu
          gleam export hex-tarball
          mkdir -p dist
          cp "build/lumatrix-${RELEASE_VERSION}.tar" "dist/lumatrix-${RELEASE_VERSION}.tar"
          cd dist
          sha256sum "lumatrix-${RELEASE_VERSION}.tar" > SHA256SUMS

      - name: Attest release tarball provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/lumatrix-${{ env.RELEASE_VERSION }}.tar

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumatrix-${{ env.RELEASE_VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Create or update GitHub release
        if: env.CREATE_GITHUB_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/lumatrix-${RELEASE_VERSION}.tar" \
              "dist/SHA256SUMS" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/lumatrix-${RELEASE_VERSION}.tar" \
              "dist/SHA256SUMS" \
              --verify-tag \
              --title "Lumatrix ${RELEASE_VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish package and documentation to Hex
        if: env.PUBLISH_HEX == 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: |
          set -eu
          if [ -z "$HEXPM_API_KEY" ]; then
            echo "::error::HEXPM_API_KEY is not configured"
            exit 1
          fi
          gleam publish --yes
